<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff · Sign in — Guest Service Requests mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6E66}a:hover{color:#0A524C}
</style>
</head>
<body>
<div style="box-sizing: border-box; min-height: 820px; background: #F5F6F3; font-family: 'Figtree', system-ui, sans-serif; color: #1C2B2A; display: flex; flex-direction: column">
  <header style="background: #FFFFFF; border-bottom: 1px solid #DDE2E0; padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
    <div style="width: 34px; height: 34px; border-radius: 9px; background: #0E6E66; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-5h4v5"></path></svg>
    </div>
    <span style="font-weight: 700; font-size: 17px">Guest Requests · Staff</span>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px">
    <form style="width: 100%; max-width: 420px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDE2E0; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">Staff sign in</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4A5856">Use your work email. You'll stay signed in for your shift.</p>
      </div>
      
        <div role="alert" style="background: #FBEAE6; color: #8A2A17; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 600">Email or password is incorrect.</div>
      
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="email" style="font-size: 14px; font-weight: 600">Email</label>
        <input id="email" type="email" value="aisyah@riverside.demo" autocomplete="username" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9D0CE; border-radius: 10px; padding: 0 14px; font-size: 16px; font-family: inherit; color: #1C2B2A">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="pw" style="font-size: 14px; font-weight: 600">Password</label>
        <input id="pw" type="password" value="wrongpass" autocomplete="current-password" style="height: 48px; box-sizing: border-box; border: 1.5px solid #C9D0CE; border-radius: 10px; padding: 0 14px; font-size: 16px; font-family: inherit; color: #1C2B2A">
      </div>
      <a href="07-staff-queue.html" style="height: 48px; border-radius: 10px; background: #0E6E66; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign in</a>
      <p style="margin: 0; font-size: 12px; line-height: 1.5; color: #5C6A68">Demo accounts only. See docs/reference.md.</p>
    </form>
  </main>
</div>
</body>
</html>
